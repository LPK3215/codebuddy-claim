[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebuddy-claim"
version = "0.1.0"
description = "Batch claim CodeBuddy account credits (activity compensation and welcome gift) from a single-file Python CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "LPK3215", email = "130586883+LPK3215@users.noreply.github.com" }]
keywords = ["codebuddy", "cli", "automation", "rewards", "credits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = ["cryptography>=42.0"]

[project.urls]
Homepage = "https://github.com/LPK3215/codebuddy-claim"
Repository = "https://github.com/LPK3215/codebuddy-claim"
Issues = "https://github.com/LPK3215/codebuddy-claim/issues"

[project.scripts]
codebuddy-claim = "codebuddy_claim:main"

[tool.setuptools]
py-modules = ["codebuddy_claim"]
